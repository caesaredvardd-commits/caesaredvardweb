    <title>CAESAR — Official Website</title>

    <style>
        /* --- ESTILOS GENERALES Y TEMÁTICA AMANO --- */
        :root {
            --bg-dark: #070708;
            --bg-card: #111113;
            --text-light: #e6e6e8;
            --text-dim: #909095;
            --accent-red: #c22929;
            --accent-red-hover: #e63939;
            --font-title: 'Cinzel', serif;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* --- HEADER & NAVEGACIÓN --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: linear-gradient(180deg, rgba(7,7,8,0.9) 0%, rgba(7,7,8,0) 100%);
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 101;
            transition: color 0.3s;
        }

        .menu-btn:hover {
            color: var(--accent-red);
        }

        .hamburger {
            width: 26px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--text-light);
            transition: 0.3s ease;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--text-light);
            text-align: center;
        }

        .lang-select {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-dim);
        }

        .lang-select span.active {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* --- MENÚ LATERAL DESPLEGABLE --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background-color: #0c0c0e;
            border-right: 1px solid rgba(194, 41, 41, 0.2);
            z-index: 160;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .sidebar.active {
            left: 0;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--accent-red);
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
