<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAESAR — Official Website</title>
    <!-- Fuentes elegantes estilo Amano -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS GENERALES Y TEMÁTICA AMANO --- */
        :root {
            --bg-dark: #070708;
            --bg-card: #111113;
            --text-light: #e6e6e8;
            --text-dim: #909095;
            --accent-red: #c22929;
            --accent-red-hover: #e63939;
            --font-title: 'Cinzel', serif;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --sidebar-width: 320px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* --- HEADER & NAVEGACIÓN --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: linear-gradient(180deg, rgba(7,7,8,0.9) 0%, rgba(7,7,8,0) 100%);
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 101;
            transition: color 0.3s;
        }

        .menu-btn:hover {
            color: var(--accent-red);
        }

        .hamburger {
            width: 26px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--text-light);
            transition: 0.3s ease;
        }

        .logo {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--text-light);
            text-align: center;
        }

        .lang-select {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-dim);
        }

        .lang-select span.active {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* --- MENÚ LATERAL DESPLEGABLE --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background-color: #0c0c0e;
            border-right: 1px solid rgba(194, 41, 41, 0.2);
            z-index: 160;
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .sidebar.active {
            left: 0;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--accent-red);
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-nav a {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: var(--text-light);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-nav a:hover {
            color: var(--accent-red);
            padding-left: 8px;
        }

        .sidebar-footer {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .sidebar-footer p {
            margin-bottom: 8px;
        }

        /* --- HERO SECCIÓN (ESTILO AMANO) --- */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(194, 41, 41, 0.15) 0%, rgba(7, 7, 8, 1) 70%),
                        url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            padding: 0 20px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 7, 8, 0.65);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.4rem;
            color: var(--accent-red);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .hero-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .btn-enter {
            display: inline-block;
            padding: 12px 36px;
            border: 1px solid var(--accent-red);
            color: var(--text-light);
            font-family: var(--font-sans);
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            background: rgba(194, 41, 41, 0.1);
        }

        .btn-enter:hover {
            background: var(--accent-red);
            box-shadow: 0 0 20px rgba(194, 41, 41, 0.6);
            color: #fff;
        }

        /* --- GALERÍA / CATÁLOGO --- */
        .section-title {
            font-family: var(--font-title);
            font-size: 2rem;
            text-align: center;
            letter-spacing: 6px;
            margin: 80px 0 15px 0;
            text-transform: uppercase;
        }

        .section-subtitle {
            text-align: center;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 100px 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }

        .art-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .art-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-red);
            box-shadow: 0 12px 30px rgba(194, 41, 41, 0.25);
        }

        .art-img-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
            overflow: hidden;
        }

        .art-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.05);
            transition: transform 0.6s ease, filter 0.6s ease;
        }

        .art-card:hover .art-img-wrapper img {
            transform: scale(1.06);
            filter: brightness(1.05) contrast(1.1);
        }

        .badge-status {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 4px 10px;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(7, 7, 8, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        .badge-status.sold {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .art-info {
            padding: 22px;
            background: var(--bg-card);
        }

        .art-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .art-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .art-price {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        /* --- VISTA DETALLADA / MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 6, 0.95);
            backdrop-filter: blur(8px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid rgba(194, 41, 41, 0.3);
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            position: relative;
            padding: 30px;
            border-radius: 2px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            z-index: 10;
        }

        .modal-img-container img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            font-family: var(--font-serif);
            font-size:
